name: .NET CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore locked dependencies
        run: dotnet restore DomainCopilot.sln --locked-mode

      - name: Build
        run: dotnet build DomainCopilot.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DomainCopilot.sln --configuration Release --no-build --no-restore
